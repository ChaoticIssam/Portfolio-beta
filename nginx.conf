server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Hide Nginx version fingerprint ───────────────────────────────────────
    server_tokens off;

    # ─── MIME Types ───────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
        application/wasm  wasm;
    }
    default_type application/octet-stream;

    # ─── Rate Limiting zones ──────────────────────────────────────────────────
    # 100 unique IPs stored in 10MB zone; burst up to 20 req/s
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=asset_limit:10m  rate=120r/m;
    # Return 429 Too Many Requests instead of 503 when rate limited
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript application/x-javascript
        text/xml application/xml application/xml+rss
        model/gltf-binary image/svg+xml;

    # ─── Security Headers (applied to all responses) ──────────────────────────
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header X-XSS-Protection         "1; mode=block"                  always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com data:; \
         img-src 'self' data: blob:; \
         connect-src 'self' https:; \
         worker-src 'self' blob:; \
         media-src 'self' blob:; \
         object-src 'none'; \
         base-uri 'self'; \
         form-action 'self' mailto:; \
         frame-ancestors 'none';" always;

    # ─── Block common vulnerability scanners & bots ───────────────────────────
    location ~* \.(env|git|sh|bak|swp|sql|log|conf|config|lock|json)$ {
        deny all;
        return 404;
    }
    location ~ /\.ht {
        deny all;
        return 404;
    }
    location ~ /\.git {
        deny all;
        return 404;
    }

    # ─── Block script injection attempts ──────────────────────────────────────
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # ─── Main SPA fallback ────────────────────────────────────────────────────
    location / {
        limit_req zone=global_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # ─── Static assets: long-lived cache ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|glb|gltf|wasm|woff2|woff|ttf)$ {
        limit_req zone=asset_limit burst=40 nodelay;

        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
    }

    # ─── Robots.txt – allow all by default ────────────────────────────────────
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # ─── Explicit 404 for undefined routes not covered by SPA fallback ────────
    error_page 404 /index.html;
    error_page 429 = @rate_limited;
    error_page 500 502 503 504 /index.html;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too Many Requests","retryAfter":60}';
    }
}
