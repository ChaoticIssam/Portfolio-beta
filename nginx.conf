server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Include standard Nginx MIME types (.html, .js, .css, etc.)
    include /etc/nginx/mime.types;

    # Add custom WebGL GLB/GLTF mime types
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/wasm wasm;
    }

    default_type application/octet-stream;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript model/gltf-binary;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
